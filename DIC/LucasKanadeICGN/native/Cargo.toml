[package]
name = "dic-rt-wgpu-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "PyO3 host for the DIC-RT native wgpu backend"
license = "MIT"

[lib]
name = "_wgpu_native"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30"
pollster = "0.4"
pyo3 = { version = "0.30", features = ["extension-module"] }
wgpu = "30.0.1"

[dev-dependencies]
shaderc = "0.10.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
