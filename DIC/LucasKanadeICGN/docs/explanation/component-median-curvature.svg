<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title description">
  <title id="title">Curvature error after component-wise median replacement</title>
  <desc id="description">Grouped bars compare curvature RMSE with displacement-only and all-coefficient median scopes for moderate clean, strong clean, and noisy analytic fields. The all-coefficient scope reduces relative error to 69.3, 70.4, and 63.7 percent.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#222222">Curvature RMSE by median-filter scope</text>
  <text x="450" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">32 x 32 uniform subsets; lower is better; displacement scope = 100%</text>

  <line x1="95" y1="335" x2="850" y2="335" stroke="#333333" stroke-width="2"/>
  <line x1="95" y1="95" x2="95" y2="335" stroke="#333333" stroke-width="2"/>
  <line x1="95" y1="215" x2="850" y2="215" stroke="#d8d8d8" stroke-width="1"/>
  <line x1="95" y1="95" x2="850" y2="95" stroke="#d8d8d8" stroke-width="1"/>
  <text x="82" y="340" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444444">0</text>
  <text x="82" y="220" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444444">50</text>
  <text x="82" y="100" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444444">100%</text>

  <rect x="160" y="95" width="55" height="240" rx="4" fill="#9aa0a6"/>
  <rect x="225" y="169" width="55" height="166" rx="4" fill="#1f77b4"/>
  <text x="187" y="87" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444444">100</text>
  <text x="252" y="161" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f5f91">69.3</text>
  <text x="220" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Moderate clean</text>
  <text x="220" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f5f91">-30.7%</text>

  <rect x="385" y="95" width="55" height="240" rx="4" fill="#9aa0a6"/>
  <rect x="450" y="166" width="55" height="169" rx="4" fill="#1f77b4"/>
  <text x="412" y="87" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444444">100</text>
  <text x="477" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f5f91">70.4</text>
  <text x="445" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Strong clean</text>
  <text x="445" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f5f91">-29.6%</text>

  <rect x="610" y="95" width="55" height="240" rx="4" fill="#9aa0a6"/>
  <rect x="675" y="182" width="55" height="153" rx="4" fill="#1f77b4"/>
  <text x="637" y="87" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444444">100</text>
  <text x="702" y="174" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f5f91">63.7</text>
  <text x="670" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Noise sigma = 1</text>
  <text x="670" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f5f91">-36.3%</text>

  <rect x="300" y="405" width="18" height="12" fill="#9aa0a6"/>
  <text x="326" y="416" font-family="sans-serif" font-size="13" fill="#333333">displacement scope</text>
  <rect x="555" y="405" width="18" height="12" fill="#1f77b4"/>
  <text x="581" y="416" font-family="sans-serif" font-size="13" fill="#333333">all-coefficient scope</text>
</svg>
