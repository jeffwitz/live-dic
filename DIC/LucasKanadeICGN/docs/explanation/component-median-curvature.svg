<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title description">
  <title id="title">Curvature error for four median-filter policies</title>
  <desc id="description">Grouped bars compare curvature RMSE for displacement or all-coefficient detection, with flagged-component or whole-state replacement, on three analytic fields. Lower is better.</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#222222">Curvature RMSE by median policy</text>
  <text x="450" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">31 x 31 Gaussian subsets; displacement/flagged = 100%; lower is better</text>
  <line x1="85" y1="340" x2="860" y2="340" stroke="#333333" stroke-width="2"/>
  <line x1="85" y1="90" x2="85" y2="340" stroke="#333333" stroke-width="2"/>
  <line x1="85" y1="215" x2="860" y2="215" stroke="#d8d8d8" stroke-width="1"/>
  <line x1="85" y1="90" x2="860" y2="90" stroke="#d8d8d8" stroke-width="1"/>
  <text x="72" y="345" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444444">0</text>
  <text x="72" y="220" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444444">50</text>
  <text x="72" y="95" text-anchor="end" font-family="sans-serif" font-size="13" fill="#444444">100%</text>
  <rect x="130" y="90" width="38" height="250" rx="3" fill="#9aa0a6"/>
  <rect x="172" y="90" width="38" height="250" rx="3" fill="#d0a21b"/>
  <rect x="214" y="171" width="38" height="169" rx="3" fill="#1f77b4"/>
  <rect x="256" y="223" width="38" height="117" rx="3" fill="#2ca02c"/>
  <text x="212" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Moderate clean</text>
  <text x="275" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#207520">46.8</text>
  <rect x="365" y="90" width="38" height="250" rx="3" fill="#9aa0a6"/>
  <rect x="407" y="90" width="38" height="250" rx="3" fill="#d0a21b"/>
  <rect x="449" y="168" width="38" height="172" rx="3" fill="#1f77b4"/>
  <rect x="491" y="225" width="38" height="115" rx="3" fill="#2ca02c"/>
  <text x="447" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Strong clean</text>
  <text x="510" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#207520">46.1</text>
  <rect x="600" y="90" width="38" height="250" rx="3" fill="#9aa0a6"/>
  <rect x="642" y="90" width="38" height="250" rx="3" fill="#d0a21b"/>
  <rect x="684" y="182" width="38" height="158" rx="3" fill="#1f77b4"/>
  <rect x="726" y="231" width="38" height="109" rx="3" fill="#2ca02c"/>
  <text x="682" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222222">Noise sigma = 1</text>
  <text x="745" y="223" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#207520">43.8</text>
  <rect x="85" y="398" width="18" height="12" fill="#9aa0a6"/>
  <text x="111" y="409" font-family="sans-serif" font-size="13" fill="#333333">displacement / flagged</text>
  <rect x="315" y="398" width="18" height="12" fill="#d0a21b"/>
  <text x="341" y="409" font-family="sans-serif" font-size="13" fill="#333333">displacement / all</text>
  <rect x="535" y="398" width="18" height="12" fill="#1f77b4"/>
  <text x="561" y="409" font-family="sans-serif" font-size="13" fill="#333333">all / flagged (default)</text>
  <rect x="315" y="432" width="18" height="12" fill="#2ca02c"/>
  <text x="341" y="443" font-family="sans-serif" font-size="13" fill="#333333">all / all (best curvature, worse displacement and gradient)</text>
</svg>
