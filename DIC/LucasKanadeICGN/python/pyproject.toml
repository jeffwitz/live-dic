[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucas-kanade-icgn-webgl"
version = "0.1.0"
description = "Headless Python interface for affine IC-GN GPU solvers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "websockets>=10",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]
native = ["wgpu>=0.32,<0.33; python_version >= '3.11'"]

[project.scripts]
icgn-webgl = "lucas_kanade_icgn.cli:main"

[project.urls]
"Original tests_gpuio project by Pierre Margerit" = "https://github.com/MargeritPierre/tests_gpuio"
"Python DIC fork" = "https://github.com/jeffwitz/tests_gpuio"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lucas_kanade_icgn = [
  "py.typed",
  "shaders/*.wgsl",
  "web/*.html",
  "web/*.js",
  "web/LICENSES/*.txt",
  "web/three/*.html",
  "web/three/*.js",
  "web/three/vendor/*.js",
  "web/three/vendor/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

