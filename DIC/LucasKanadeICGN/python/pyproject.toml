[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucas-kanade-icgn-webgl"
version = "0.1.0"
description = "Python-supervised real-time digital image correlation with native WebGPU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "websockets>=10",
  "wgpu>=0.32,<0.33",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
icgn-webgl = "lucas_kanade_icgn.cli:main"

[project.urls]
"Original tests_gpuio project by Pierre Margerit" = "https://github.com/MargeritPierre/tests_gpuio"
"Source" = "https://github.com/jeffwitz/live-dic"
"Documentation" = "https://github.com/jeffwitz/live-dic/tree/main/DIC/LucasKanadeICGN/docs"
"Issues" = "https://github.com/jeffwitz/live-dic/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lucas_kanade_icgn = [
  "py.typed",
  "shaders/*.wgsl",
  "web/*.html",
  "web/*.js",
  "web/LICENSES/*.txt",
  "web/common/*.js",
  "web/three/*.html",
  "web/three/*.js",
  "web/three/vendor/*.js",
  "web/three/vendor/*.txt",
  "web/webgpu/*.html",
  "web/webgpu/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lucas_kanade_icgn"]
