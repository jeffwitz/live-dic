<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Affine Lucas-Kanade IC-GN — GPU-IO</title>
    <style>
      html, body, canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      #status {
        position: fixed;
        left: 12px;
        bottom: 10px;
        z-index: 2;
        max-width: min(620px, calc(100vw - 24px));
        padding: 7px 10px;
        color: #eee;
        background: rgb(0 0 0 / 65%);
        font: 12px/1.35 system-ui, sans-serif;
        pointer-events: none;
      }

      #results {
        position: fixed;
        left: 12px;
        top: 10px;
        z-index: 2;
        min-width: 360px;
        max-width: min(680px, calc(100vw - 380px));
        max-height: calc(100vh - 90px);
        overflow: auto;
        padding: 9px 11px;
        color: #d8f5df;
        background: rgb(0 18 8 / 78%);
        border: 1px solid rgb(130 255 170 / 30%);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
      }

      #credit {
        position: fixed;
        right: 12px;
        bottom: 10px;
        z-index: 3;
        max-width: min(430px, calc(100vw - 24px));
        padding: 8px 11px;
        color: #eee;
        background: rgb(0 0 0 / 72%);
        border: 1px solid rgb(255 255 255 / 24%);
        font: 12px/1.4 system-ui, sans-serif;
      }

      #credit a {
        color: #8ecbff;
      }
    </style>
    <script src="../../gpu-io.js"></script>
    <script src="../../tweakpane.js"></script>
    <script src="./vendor/tweakpane-plugin-essentials-0.1.0.min.js"></script>
  </head>
  <body>
    <pre id="results">Loading the raw test dataset...</pre>
    <div id="status">Initializing the raw-image benchmark...</div>
    <aside id="credit">
      <strong>Foundational work by
        <a href="https://github.com/MargeritPierre" target="_blank" rel="noreferrer">
          Pierre Margerit
        </a>.
      </strong>
      This implementation continues Pierre's original
      <a href="https://github.com/MargeritPierre/tests_gpuio" target="_blank" rel="noreferrer">
        tests_gpuio
      </a>
      GPU-IO and WebGL work.
    </aside>
    <script src="./LucasKanadeICGN.js"></script>
  </body>
</html>
