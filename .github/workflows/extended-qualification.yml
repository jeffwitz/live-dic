name: Extended qualification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "DIC/LucasKanadeICGN/package.json"
      - "DIC/LucasKanadeICGN/package-lock.json"
      - "DIC/LucasKanadeICGN/eslint.config.mjs"
      - ".ruff.toml"
      - "tools/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "DIC/LucasKanadeICGN/python/**"
      - "DIC/LucasKanadeICGN/benchmarks/*.py"
      - "DIC/LucasKanadeICGN/assets/**"
      - "DIC/LucasKanadeICGN/web-app/**"
      - "DIC/LucasKanadeICGN/three/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-platform-python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: DIC/LucasKanadeICGN/python/pyproject.toml

      - name: Install package and development tools
        run: python -m pip install "./DIC/LucasKanadeICGN/python[dev]"

      - name: Build and validate the distributed wheel
        run: |
          python -m pip wheel --no-deps ./DIC/LucasKanadeICGN/python --wheel-dir wheel-dist
          python tools/check_repository.py --wheel-dir wheel-dist
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('wheel-dist').glob('*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)"
          python -I -c "import live_dic; from importlib.resources import files; assert files('live_dic').joinpath('shaders/icgn.wgsl').is_file(); print(live_dic.__file__)"

      - name: Run portable unit tests
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -v

      - name: Check Python style
        run: |
          ruff check DIC/LucasKanadeICGN/python DIC/LucasKanadeICGN/benchmarks tools DIC/LucasKanadeICGN/docs
          ruff format --check DIC/LucasKanadeICGN/python DIC/LucasKanadeICGN/benchmarks tools DIC/LucasKanadeICGN/docs

  gpu-lavapipe:
    name: Linux / lavapipe GPU regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DIC/LucasKanadeICGN/python/pyproject.toml

      - name: Install the Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools

      - name: Install the native backend
        run: python -m pip install "./DIC/LucasKanadeICGN/python"

      - name: Report the Vulkan adapter
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: vulkaninfo --summary

      - name: Run WGSL regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_gpu_regressions.py
          -v

      - name: Run affine seeded and frontier contracts on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          ICGN_TEST_DEVICE_TYPE: "cpu"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          python -m unittest discover -s DIC/LucasKanadeICGN/python/tests -p test_public_seeded.py -v
          python -m unittest discover -s DIC/LucasKanadeICGN/python/tests -p test_affine_frontier.py -v

      - name: Run native UHD image and ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_uhd_fixtures.py
          -v

      - name: Run full-window ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_roi.py
          -v

      - name: Run partial-support ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_partial_roi.py
          -v

      - name: Run native UHD plate ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_plate_hole.py
          -v

      - name: Run temporal pyramid regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_temporal_init.py
          -v

      - name: Run native fused-pyramid regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_fused_pyramid.py
          -v

      - name: Run native latency-policy regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_latency_options.py
          -v

  chromium-extended:
    name: Linux / Chromium extended UHD qualification
    needs: gpu-lavapipe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare one shared browser environment
        uses: ./.github/actions/browser-environment

      - name: Execute core, ROI and input contracts in browser Chromium
        env:
          ICGN_RUN_BROWSER_TESTS: "1"
          ICGN_BROWSER_SOFTWARE: "1"
        run: python -m unittest discover -s DIC/LucasKanadeICGN/python/tests -p test_browser_core.py -v

      - name: Compare GPU reference preparation against the CPU oracle
        env:
          ICGN_RUN_BROWSER_TESTS: "1"
          ICGN_BROWSER_SOFTWARE: "1"
        run: python -m unittest discover -s DIC/LucasKanadeICGN/python/tests -p test_gpu_reference.py -v

      - name: Compare chronological browser frames with native CPU results
        run: >-
          python DIC/LucasKanadeICGN/benchmarks/qualify_browser_core.py
          --software-browser --native-device cpu --output browser-results/parity.json

      - name: Exercise local sources and consecutive ROI failures
        run: >-
          python tools/qualify_local_sources.py --site _site --software
          --output browser-results/local-sources

      - name: Exercise workspace interactions in a real Chromium DOM
        env:
          ICGN_RUN_BROWSER_DOM_TESTS: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_browser_workspace_dom.py
          -v

      - name: Qualify disk storage and quota recovery
        run: >-
          python tools/qualify_browser_storage.py --site _site --software
          --output browser-results/storage

      - name: Qualify recording overlap, failures, late decode and export
        run: >-
          python tools/qualify_browser_pipeline.py --site _site --software
          --output browser-results/pipeline/report.json

      - name: Smoke-test the application under a subpath
        run: >-
          python tools/smoke_browser_app.py --site _site --software --frames 10
          --export --report browser-results/app.json

      - name: Qualify editor, masks and live vectors
        run: |
          python tools/qualify_browser_editor.py --site _site --software --report browser-results/editor.json --screenshots browser-results/editor
          python tools/qualify_live_vectors.py --site _site --software --report browser-results/live-vectors.json

      - name: Qualify local sources, TIFF imports and ROI failures
        run: |
          python tools/qualify_local_sources.py --site _site --software --output browser-results/local-sources
          python tools/qualify_browser_tiff.py --site _site --software --output browser-results/tiff

      - name: Qualify workbench analysis, field review and interchange
        run: |
          python tools/qualify_browser_workbench.py --site _site --software --output browser-results/workbench
          python tools/qualify_browser_review.py --site _site --software --field browser-results/workbench/processed-field.npz --output browser-results/review-only
          python tools/qualify_browser_review.py --site _site --software --no-worker --field browser-results/workbench/processed-field.npz --output browser-results/review-main-thread

      - name: Qualify workflow, solver settings and UHD masks
        run: |
          python tools/qualify_browser_workflow.py --site _site --software --output browser-results/workflow
          python tools/qualify_solver_settings.py --site _site --software --output browser-results/solver-settings
          python tools/qualify_browser_mask_images.py --site _site --software --output browser-results/mask-images

      - name: Retain all extended browser reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-browser-qualification
          path: browser-results/
          if-no-files-found: warn
