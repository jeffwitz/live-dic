name: Browser application / GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'DIC/LucasKanadeICGN/web-app/**'
      - 'DIC/LucasKanadeICGN/python/src/lucas_kanade_icgn/web/core/**'
      - 'DIC/LucasKanadeICGN/python/src/lucas_kanade_icgn/shaders/**'
      - 'DIC/LucasKanadeICGN/assets/uhd_plate_hole/**'
      - 'tools/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble and verify canonical shader and demo hashes
        run: python3 tools/build_pages.py --output _site
      - name: Check JavaScript syntax
        run: find _site -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Check the owner's existing Pages configuration
        id: pages
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.error, urllib.request
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(request) as response:
                  configured = json.load(response).get("build_type") == "workflow"
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              configured = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(configured).lower()}\n")
          print("Pages deployment enabled by owner" if configured else
                "Artifact prepared; deployment skipped until Settings > Pages > GitHub Actions is selected")
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages (requires repository setting chosen by its owner)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
