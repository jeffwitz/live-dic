name: Browser application / GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'DIC/LucasKanadeICGN/web-app/**'
      - 'DIC/LucasKanadeICGN/python/src/lucas_kanade_icgn/web/core/**'
      - 'DIC/LucasKanadeICGN/python/src/lucas_kanade_icgn/shaders/**'
      - 'DIC/LucasKanadeICGN/assets/uhd_plate_hole/**'
      - 'tools/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble and verify canonical shader and demo hashes
        run: python3 tools/build_pages.py --output _site
      - name: Check JavaScript syntax
        run: find _site -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages (requires repository setting chosen by its owner)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
