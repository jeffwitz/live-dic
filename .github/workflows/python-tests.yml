name: Python tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-tests.yml"
      - ".github/actions/**"
      - "DIC/LucasKanadeICGN/package.json"
      - "DIC/LucasKanadeICGN/package-lock.json"
      - "DIC/LucasKanadeICGN/eslint.config.mjs"
      - ".ruff.toml"
      - "tools/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "DIC/LucasKanadeICGN/python/**"
      - "DIC/LucasKanadeICGN/benchmarks/*.py"
      - "DIC/LucasKanadeICGN/assets/**"
      - "DIC/LucasKanadeICGN/web-app/**"
      - "DIC/LucasKanadeICGN/three/**"
  pull_request:
    paths:
      - ".github/workflows/python-tests.yml"
      - ".github/actions/**"
      - "DIC/LucasKanadeICGN/package.json"
      - "DIC/LucasKanadeICGN/package-lock.json"
      - "DIC/LucasKanadeICGN/eslint.config.mjs"
      - ".ruff.toml"
      - "tools/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "DIC/LucasKanadeICGN/python/**"
      - "DIC/LucasKanadeICGN/benchmarks/*.py"
      - "DIC/LucasKanadeICGN/assets/**"
      - "DIC/LucasKanadeICGN/web-app/**"
      - "DIC/LucasKanadeICGN/three/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: DIC/LucasKanadeICGN/python/pyproject.toml

      - name: Install package and development tools
        run: python -m pip install "./DIC/LucasKanadeICGN/python[dev]"

      - name: Build and validate the distributed wheel
        run: |
          python -m pip wheel --no-deps ./DIC/LucasKanadeICGN/python --wheel-dir wheel-dist
          python tools/check_repository.py --wheel-dir wheel-dist
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('wheel-dist').glob('*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)"
          python -I -c "import live_dic; from importlib.resources import files; assert files('live_dic').joinpath('shaders/icgn.wgsl').is_file(); print(live_dic.__file__)"

      - name: Run portable unit tests
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -v

      - name: Check Python style
        run: |
          ruff check DIC/LucasKanadeICGN/python DIC/LucasKanadeICGN/benchmarks tools DIC/LucasKanadeICGN/docs
          ruff format --check DIC/LucasKanadeICGN/python DIC/LucasKanadeICGN/benchmarks tools DIC/LucasKanadeICGN/docs

  javascript-lint:
    name: JavaScript / ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: DIC/LucasKanadeICGN/package-lock.json

      - name: Install JavaScript development tools
        run: npm ci
        working-directory: DIC/LucasKanadeICGN

      - name: Lint first-party JavaScript
        run: npm run lint
        working-directory: DIC/LucasKanadeICGN

  gpu-lavapipe:
    name: Linux / lavapipe GPU regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DIC/LucasKanadeICGN/python/pyproject.toml

      - name: Install the Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools

      - name: Install the native backend
        run: python -m pip install "./DIC/LucasKanadeICGN/python"

      - name: Report the Vulkan adapter
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: vulkaninfo --summary

      - name: Run WGSL regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_gpu_regressions.py
          -v

      - name: Run affine seeded and frontier contracts on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          ICGN_TEST_DEVICE_TYPE: "cpu"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          python -m unittest discover -s DIC/LucasKanadeICGN/python/tests -p test_public_seeded.py -v
          python -m unittest discover -s DIC/LucasKanadeICGN/python/tests -p test_affine_frontier.py -v

      - name: Run native UHD image and ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_uhd_fixtures.py
          -v

      - name: Run full-window ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_roi.py
          -v

      - name: Run partial-support ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_partial_roi.py
          -v

      - name: Run native UHD plate ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_plate_hole.py
          -v

      - name: Run temporal pyramid regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_temporal_init.py
          -v

      - name: Run native fused-pyramid regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_fused_pyramid.py
          -v

      - name: Run native latency-policy regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_latency_options.py
          -v

  browser-storage:
    name: Linux / Chromium UHD disk storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Python browser harness
        run: |
          python -m pip install ./DIC/LucasKanadeICGN/python
          command -v google-chrome || command -v chromium
      - name: Exercise real IndexedDB, eviction, reopen, parts and quota recovery
        run: |
          python tools/build_pages.py --output _site
          python tools/qualify_browser_storage.py --site _site --software --output browser-storage
      - name: Retain the storage qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-storage-report
          path: browser-storage/report.json
          if-no-files-found: warn

  browser-pipeline:
    name: Linux / Chromium UHD recording overlap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Python browser harness
        run: |
          python -m pip install ./DIC/LucasKanadeICGN/python
          command -v google-chrome || command -v chromium
      - name: Exercise bounded admission, failure recovery, late decode and export
        run: |
          python tools/build_pages.py --output _site
          python tools/qualify_browser_pipeline.py --site _site --software --output browser-pipeline/report.json
      - name: Retain the pipeline qualification report, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-pipeline-report
          path: browser-pipeline/report.json
          if-no-files-found: warn

  browser-parity:
    name: Linux / Chromium core and GPU parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-environment
      - name: Execute browser core, ROI, input and readback contracts
        env:
          ICGN_RUN_BROWSER_TESTS: "1"
          ICGN_BROWSER_SOFTWARE: "1"
        run: python -m unittest discover -s DIC/LucasKanadeICGN/python/tests -p test_browser_core.py -v
      - name: Execute GPU reference preparation against the CPU oracle
        env:
          ICGN_RUN_BROWSER_TESTS: "1"
          ICGN_BROWSER_SOFTWARE: "1"
        run: python -m unittest discover -s DIC/LucasKanadeICGN/python/tests -p test_gpu_reference.py -v
      - name: Compare ordered browser frames with native CPU results
        run: >-
          python DIC/LucasKanadeICGN/benchmarks/qualify_browser_core.py
          --software-browser --native-device cpu --output browser-results/parity.json
      - name: Retain parity report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-parity-report
          path: browser-results/
          if-no-files-found: warn

  browser-editor:
    name: Linux / Chromium UHD editor and vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-environment
      - name: Exercise the demo under a subpath
        run: python tools/smoke_browser_app.py --site _site --software --frames 10 --export --report browser-results/app.json
      - name: Exercise UHD plate, mask editing and GPU display
        run: >-
          python tools/qualify_browser_editor.py --site _site --software
          --report browser-results/editor.json --screenshots browser-results/editor
      - name: Verify live vector pixels, image anchoring and UHD preview
        run: >-
          python tools/qualify_live_vectors.py --site _site --software
          --report browser-results/live-vectors.json
      - name: Retain editor reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-editor-reports
          path: browser-results/
          if-no-files-found: warn

  browser-imports:
    name: Linux / Chromium UHD image imports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-environment
      - name: Exercise local sources and consecutive ROI failures
        run: >-
          python tools/qualify_local_sources.py --site _site --software
          --output browser-results/local-sources
      - name: Exercise UHD TIFF, masks, PNG parity and offline decoding
        run: >-
          python tools/qualify_browser_tiff.py --site _site --software
          --output browser-results/tiff
      - name: Retain import reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-import-reports
          path: browser-results/
          if-no-files-found: warn

  browser-workbench:
    name: Linux / Chromium UHD workbench and review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-environment
      - name: Exercise results analysis, measurements and NPZ interchange
        run: >-
          python tools/qualify_browser_workbench.py --site _site --software
          --output browser-results/workbench
      - name: Review the produced UHD field without WebGPU or OffscreenCanvas
        run: |
          python tools/qualify_browser_review.py --site _site --software --field browser-results/workbench/processed-field.npz --output browser-results/review-only
          python tools/qualify_browser_review.py --site _site --software --no-worker --field browser-results/workbench/processed-field.npz --output browser-results/review-main-thread
      - name: Retain workbench and review reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-workbench-reports
          path: browser-results/
          if-no-files-found: warn

  browser-workflow:
    name: Linux / Chromium UHD workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-environment
      - name: Exercise explicit UHD calculation and playback without new correlations
        run: >-
          python tools/qualify_browser_workflow.py --site _site --software
          --output browser-results/workflow
      - name: Retain workflow report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-workflow-report
          path: browser-results/
          if-no-files-found: warn

  browser-solver-settings:
    name: Linux / Chromium UHD solver settings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-environment
      - name: Apply solver settings and retain saved-field provenance
        run: >-
          python tools/qualify_solver_settings.py --site _site --software
          --output browser-results/solver-settings
      - name: Retain solver-settings report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-solver-settings-report
          path: browser-results/
          if-no-files-found: warn

  browser-mask-images:
    name: Linux / Chromium UHD masks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/browser-environment
      - name: Exercise UHD mask images, vector clipping and PNG export
        run: >-
          python tools/qualify_browser_mask_images.py --site _site --software
          --output browser-results/mask-images
      - name: Retain mask report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-mask-report
          path: browser-results/
          if-no-files-found: warn
