name: Python tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-tests.yml"
      - "DIC/LucasKanadeICGN/python/**"
      - "DIC/LucasKanadeICGN/assets/**"
  pull_request:
    paths:
      - ".github/workflows/python-tests.yml"
      - "DIC/LucasKanadeICGN/python/**"
      - "DIC/LucasKanadeICGN/assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: DIC/LucasKanadeICGN/python/pyproject.toml

      - name: Install package and development tools
        run: python -m pip install "./DIC/LucasKanadeICGN/python[dev]"

      - name: Run portable unit tests
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -v

      - name: Check Python style
        run: |
          ruff check DIC/LucasKanadeICGN/python
          ruff format --check DIC/LucasKanadeICGN/python

  gpu-lavapipe:
    name: Linux / lavapipe GPU regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DIC/LucasKanadeICGN/python/pyproject.toml

      - name: Install the Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools

      - name: Install the native backend
        run: python -m pip install "./DIC/LucasKanadeICGN/python"

      - name: Report the Vulkan adapter
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: vulkaninfo --summary

      - name: Run WGSL regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_gpu_regressions.py
          -v

      - name: Run original UHD image regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_uhd_fixtures.py
          -v
