name: Python tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/python-tests.yml"
      - ".ruff.toml"
      - "tools/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "DIC/LucasKanadeICGN/python/**"
      - "DIC/LucasKanadeICGN/benchmarks/*.py"
      - "DIC/LucasKanadeICGN/assets/**"
      - "DIC/LucasKanadeICGN/web-app/**"
  pull_request:
    paths:
      - ".github/workflows/python-tests.yml"
      - ".ruff.toml"
      - "tools/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "DIC/LucasKanadeICGN/python/**"
      - "DIC/LucasKanadeICGN/benchmarks/*.py"
      - "DIC/LucasKanadeICGN/assets/**"
      - "DIC/LucasKanadeICGN/web-app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: DIC/LucasKanadeICGN/python/pyproject.toml

      - name: Install package and development tools
        run: python -m pip install "./DIC/LucasKanadeICGN/python[dev]"

      - name: Build and validate the distributed wheel
        run: |
          python -m pip wheel --no-deps ./DIC/LucasKanadeICGN/python --wheel-dir wheel-dist
          python tools/check_repository.py --wheel-dir wheel-dist
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('wheel-dist').glob('*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)"
          python -I -c "import lucas_kanade_icgn; from importlib.resources import files; assert files('lucas_kanade_icgn').joinpath('shaders/icgn.wgsl').is_file(); print(lucas_kanade_icgn.__file__)"

      - name: Run portable unit tests
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -v

      - name: Check Python style
        run: |
          ruff check DIC/LucasKanadeICGN/python DIC/LucasKanadeICGN/benchmarks tools DIC/LucasKanadeICGN/docs
          ruff format --check DIC/LucasKanadeICGN/python DIC/LucasKanadeICGN/benchmarks tools DIC/LucasKanadeICGN/docs

  gpu-lavapipe:
    name: Linux / lavapipe GPU regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DIC/LucasKanadeICGN/python/pyproject.toml

      - name: Install the Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools

      - name: Install the native backend
        run: python -m pip install "./DIC/LucasKanadeICGN/python"

      - name: Report the Vulkan adapter
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: vulkaninfo --summary

      - name: Run WGSL regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_gpu_regressions.py
          -v

      - name: Run native UHD image and ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_uhd_fixtures.py
          -v

      - name: Run full-window ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_roi.py
          -v

      - name: Run partial-support ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_partial_roi.py
          -v

      - name: Run native UHD plate ROI regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_plate_hole.py
          -v

      - name: Run temporal pyramid regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_temporal_init.py
          -v

      - name: Run native fused-pyramid regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_fused_pyramid.py
          -v

      - name: Run native latency-policy regressions on lavapipe
        env:
          ICGN_RUN_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python -m unittest discover
          -s DIC/LucasKanadeICGN/python/tests
          -p test_latency_options.py
          -v

  browser-software:
    name: Linux / Chromium SwiftShader and native CPU parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU Vulkan driver and the Python package
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers
          python -m pip install ./DIC/LucasKanadeICGN/python
          command -v google-chrome || command -v chromium
      - name: Execute browser core, ROI, input and readback contracts
        env:
          ICGN_RUN_BROWSER_TESTS: "1"
          ICGN_BROWSER_SOFTWARE: "1"
        run: python -m unittest discover -s DIC/LucasKanadeICGN/python/tests -p test_browser_core.py -v
      - name: Compare sixty ordered frames per model and depth
        run: >-
          python DIC/LucasKanadeICGN/benchmarks/qualify_browser_core.py
          --software-browser --native-device cpu --output browser-results/parity.json
      - name: Assemble and exercise the demo under a subpath
        run: |
          python tools/build_pages.py --output _site
          python tools/smoke_browser_app.py --site _site --software --frames 10 --export --report browser-results/app.json
      - name: Exercise UHD plate, mask editing and GPU display on SwiftShader
        run: >-
          python tools/qualify_browser_editor.py --site _site --software
          --report browser-results/editor.json --screenshots browser-results/editor
      - name: Exercise UHD local sources and whole-ROI consecutive failures
        run: >-
          python tools/qualify_local_sources.py --site _site --software
          --output browser-results/local-sources
      - name: Exercise UHD results analysis, measurements and NPZ interchange
        run: >-
          python tools/qualify_browser_workbench.py --site _site --software
          --output browser-results/workbench
      - name: Review an actual UHD field without WebGPU or OffscreenCanvas
        run: |
          python tools/qualify_browser_review.py --site _site --software --field browser-results/workbench/processed-field.npz --output browser-results/review-only
          python tools/qualify_browser_review.py --site _site --software --no-worker --field browser-results/workbench/processed-field.npz --output browser-results/review-main-thread
      - name: Exercise UHD mask-image input, vector clipping and PNG export
        run: >-
          python tools/qualify_browser_mask_images.py --site _site --software
          --output browser-results/mask-images
      - name: Retain raw browser qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-software-reports
          path: browser-results/
          if-no-files-found: warn
